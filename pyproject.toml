[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-benchmark"
version = "0.1.0"
description = "Objective Robustness Benchmark for Inversion of Transcriptomes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ORBIT contributors" }
]
keywords = [
  "connectivity-map",
  "LINCS",
  "L1000",
  "disease-signature-reversal",
  "transcriptomics",
  "robustness-benchmark"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
orbit = "orbit_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

